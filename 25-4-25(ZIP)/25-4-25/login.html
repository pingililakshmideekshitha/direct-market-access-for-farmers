<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login">Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Load Supabase UMD bundle -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="home-header">
        <div class="header-content">
            <h1 data-i18n="appTitle">Farm Connect</h1>
            <div class="header-nav">
                <div class="main-nav">
                    <a href="index.html" class="nav-link" data-i18n="home">Home</a>
                    <a href="login.html" class="nav-link active" data-i18n="login">Login</a>
                    <a href="signup.html" class="nav-link" data-i18n="signup">Sign Up</a>
                </div>
            </div>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-box">
            <h1 data-i18n="loginTitle">Welcome Back</h1>
            <p class="subtitle" data-i18n="loginSubtitle">Login to your account</p>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="phone" data-i18n="phoneLabel">Phone Number</label>
                    <div class="input-group">
                        <input type="tel" id="phone" placeholder="Enter your phone number with country code (e.g., +91)" data-i18n-placeholder="phonePlaceholder" required>
                    </div>
                </div>

                <div id="otpGroup" class="form-group" style="display: none;">
                    <label for="otp" data-i18n="otpLabel">OTP</label>
                    <div class="input-group">
                        <input type="text" id="otp" placeholder="Enter OTP" data-i18n-placeholder="otpPlaceholder" maxlength="6">
                    </div>
                </div>

                <button type="submit" id="submitBtn" data-i18n="getOtpBtn">Get OTP</button>
                
                <div class="auth-links">
                    <p><span data-i18n="dontHaveAccount">Don't have an account?</span> <a href="signup.html" data-i18n="signup">Sign Up</a></p>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
